name: Precut installer candidates
on:
  workflow_dispatch:
    inputs:
      target:
        description: Installer target to test (release submissions always use the configured full matrix)
        type: choice
        default: all
        options: [all, mac-intel, windows]
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows' && '[{"runner":"windows-2025","platform":"win32","arch":"x64","build_native":true}]' || inputs.target == 'mac-intel' && '[{"runner":"macos-15-intel","platform":"darwin","arch":"x64","build_native":true}]' || vars.PRECUT_RELEASE_TARGETS || '[{"runner":"xcode-27","platform":"darwin","arch":"arm64","bundle_url":"PRECUT_NATIVE_MAC_ARM64_URL","bundle_sha":"PRECUT_NATIVE_MAC_ARM64_SHA256"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64","build_native":true},{"runner":"windows-2025","platform":"win32","arch":"x64","build_native":true}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Remove acceptance evidence from previous builds
        shell: bash
        run: |
          node --input-type=module -e 'import { readdirSync, rmSync } from "node:fs"; for (const [dir, pattern] of [["docs", /^release-results-.*\.json$/], ["docs/screenshots", /^release-.*\.png$/]]) { for (const name of readdirSync(dir)) if (pattern.test(name)) rmSync(`${dir}/${name}`); }'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore public product configuration
        shell: bash
        env:
          PRECUT_PRODUCT_CONFIG_JSON: ${{ vars.PRECUT_PRODUCT_CONFIG_JSON }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; const config = JSON.parse(process.env.PRECUT_PRODUCT_CONFIG_JSON); writeFileSync("product.config.json", JSON.stringify(config, null, 2));'
      - name: Restore pinned native bundle
        if: ${{ !matrix.build_native }}
        run: node scripts/fetch-native-bundle.mjs
        env:
          PRECUT_NATIVE_BUNDLE_URL: ${{ vars[matrix.bundle_url] }}
          PRECUT_NATIVE_BUNDLE_SHA256: ${{ vars[matrix.bundle_sha] }}
          PRECUT_NATIVE_BUNDLE_TOKEN: ${{ github.token }}
      - name: Build pinned native tools for this platform
        if: ${{ matrix.build_native }}
        run: node scripts/bootstrap-native.mjs
      - run: pnpm models:prepare
      - name: Test native CPU speech detection and transcription before packaging
        if: ${{ matrix.platform == 'win32' }}
        run: |
          pnpm fixtures:prepare
          node scripts/native-speech-smoke.mjs
      - name: Build an installer candidate without submitting to Store
        # Candidates use local packaging checks, with no Store submission.
        # Tagged Store release workflows retain their strict ref checks.
        # GitHub's default GITHUB_* variables cannot be set in step env.
        run: node --input-type=module -e 'delete process.env.GITHUB_REF; delete process.env.GITHUB_ACTIONS; await import("./scripts/build-release.mjs");'
      - run: pnpm fixtures:prepare
      - name: Test the actual packaged application
        run: node scripts/release-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: precut-candidate-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/precut-*.dmg
            out/precut-*.zip
            out/precut-*.exe
            out/artifacts-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precut-candidate-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            docs/release-results-*.json
            docs/screenshots/release-*.png
            .tools/native-speech-smoke/results.json
